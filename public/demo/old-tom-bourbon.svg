<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Old Tom Distillery bourbon label</title><desc id="desc">A cream and navy bourbon label with a complete government warning.</desc>
  <rect width="700" height="900" rx="28" fill="#f4eddc"/><rect x="28" y="28" width="644" height="844" rx="18" fill="none" stroke="#173e55" stroke-width="4"/><rect x="43" y="43" width="614" height="814" rx="12" fill="none" stroke="#aa7d36" stroke-width="2"/>
  <text x="350" y="158" text-anchor="middle" fill="#173e55" font-family="Georgia,serif" font-size="42" font-weight="bold" letter-spacing="2">OLD TOM DISTILLERY</text>
  <path d="M105 229h490M165 248h370" stroke="#aa7d36" stroke-width="2"/><text x="350" y="322" text-anchor="middle" fill="#173e55" font-family="Georgia,serif" font-size="32">KENTUCKY STRAIGHT</text><text x="350" y="367" text-anchor="middle" fill="#173e55" font-family="Georgia,serif" font-size="39" font-weight="bold">BOURBON WHISKEY</text>
  <circle cx="350" cy="485" r="64" fill="#173e55"/><text x="350" y="475" text-anchor="middle" fill="#f4eddc" font-family="Arial,sans-serif" font-size="16" font-weight="bold">AGED</text><text x="350" y="510" text-anchor="middle" fill="#f4eddc" font-family="Georgia,serif" font-size="32">4 YEARS</text>
  <text x="350" y="600" text-anchor="middle" fill="#173e55" font-family="Arial,sans-serif" font-size="20">45% ALC./VOL. · 90 PROOF</text><text x="350" y="638" text-anchor="middle" fill="#173e55" font-family="Arial,sans-serif" font-size="18">750 mL</text><text x="350" y="686" text-anchor="middle" fill="#173e55" font-family="Arial,sans-serif" font-size="14">DISTILLED AND BOTTLED BY OLD TOM DISTILLING COMPANY</text><text x="350" y="711" text-anchor="middle" fill="#173e55" font-family="Arial,sans-serif" font-size="14">BARDSTOWN, KENTUCKY</text>
  <rect x="75" y="748" width="550" height="91" rx="4" fill="#fffdf6" stroke="#173e55"/>
  <text x="90" y="772" fill="#111" font-family="Arial,sans-serif" font-size="12" font-weight="bold">GOVERNMENT WARNING:</text><text x="90" y="789" fill="#111" font-family="Arial,sans-serif" font-size="10.5">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="90" y="804" fill="#111" font-family="Arial,sans-serif" font-size="10.5">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="90" y="819" fill="#111" font-family="Arial,sans-serif" font-size="10.5">impairs your ability to drive a car or operate machinery, and may cause health problems.</text>
</svg>
