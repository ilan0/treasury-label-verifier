  <text x="350" y="456" text-anchor="middle" fill="#6e2836" font-family="Georgia,serif" font-size="55">Bellweather Cellars</text><text x="350" y="504" text-anchor="middle" fill="#6e2836" font-family="Arial,sans-serif" font-size="19" letter-spacing="6">RED WINE</text><text x="350" y="549" text-anchor="middle" fill="#6e2836" font-family="Georgia,serif" font-size="28">Napa, California</text>
  <text x="350" y="620" text-anchor="middle" fill="#563d3e" font-family="Arial,sans-serif" font-size="17">13.5% ALCOHOL BY VOLUME · 750 mL</text><text x="350" y="655" text-anchor="middle" fill="#563d3e" font-family="Arial,sans-serif" font-size="13">PRODUCED AND BOTTLED BY BELLWEATHER CELLARS</text><text x="350" y="678" text-anchor="middle" fill="#563d3e" font-family="Arial,sans-serif" font-size="13">NAPA, CALIFORNIA</text>
  <rect x="65" y="735" width="570" height="105" fill="#fff" stroke="#6e2836"/>
  <text x="80" y="758" fill="#111" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Government Warning:</text><text x="80" y="777" fill="#111" font-family="Arial,sans-serif" font-size="10">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="80" y="792" fill="#111" font-family="Arial,sans-serif" font-size="10">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="80" y="807" fill="#111" font-family="Arial,sans-serif" font-size="10">impairs your ability to drive a car or operate machinery, and may cause health problems.</text>
