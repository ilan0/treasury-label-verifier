<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Willow Creek wine label with warning error</title><desc id="desc">A red wine label whose government warning heading is incorrectly in title case.</desc>
