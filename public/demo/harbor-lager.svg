<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Harbor Light lager label</title><desc id="desc">A blue malt beverage label with declared alcohol content and a complete government warning.</desc>
  <rect width="700" height="900" rx="25" fill="#d7e7e8"/><rect x="27" y="27" width="646" height="846" rx="18" fill="#f7f4e8" stroke="#17485d" stroke-width="4"/>
  <circle cx="350" cy="238" r="135" fill="#17485d"/><path d="M255 268c38-21 63-21 96 0 35 22 60 22 96 0M270 300c32-17 54-17 81 0 28 18 50 18 80 0" fill="none" stroke="#b8ddd8" stroke-width="10" stroke-linecap="round"/><path d="M350 122v105m-45 0h90m-45-105 38 47h-76l38-47Z" fill="none" stroke="#f7f4e8" stroke-width="8"/>
  <text x="350" y="455" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="54" font-weight="900">HARBOR LIGHT</text><text x="350" y="508" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="26" letter-spacing="9">LAGER</text><path d="M155 545h390" stroke="#c69239" stroke-width="4"/>
  <text x="350" y="611" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="19" font-weight="bold">CRISP · COLD-FERMENTED</text><text x="350" y="649" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="16">12 FL. OZ. (355 mL)</text><text x="350" y="690" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="13">BREWED AND CANNED BY HARBOR BREWING COMPANY</text><text x="350" y="713" text-anchor="middle" fill="#17485d" font-family="Arial,sans-serif" font-size="13">PORTLAND, MAINE</text>
  <rect x="63" y="749" width="574" height="95" fill="#fff" stroke="#17485d"/>
  <text x="78" y="771" fill="#111" font-family="Arial,sans-serif" font-size="12" font-weight="bold">GOVERNMENT WARNING:</text><text x="78" y="789" fill="#111" font-family="Arial,sans-serif" font-size="10">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="78" y="804" fill="#111" font-family="Arial,sans-serif" font-size="10">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="78" y="819" fill="#111" font-family="Arial,sans-serif" font-size="10">impairs your ability to drive a car or operate machinery, and may cause health problems.</text>
</svg>
