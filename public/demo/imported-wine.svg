  <text x="350" y="112" text-anchor="middle" fill="#253d50" font-family="Arial,sans-serif" font-size="16" letter-spacing="8">MAISON</text><text x="350" y="177" text-anchor="middle" fill="#253d50" font-family="Georgia,serif" font-size="61">Rivage</text><path d="M180 213h340" stroke="#b18a45" stroke-width="3"/>
  <text x="350" y="310" text-anchor="middle" fill="#253d50" font-family="Georgia,serif" font-size="34">RED WINE</text><text x="350" y="354" text-anchor="middle" fill="#253d50" font-family="Arial,sans-serif" font-size="16" letter-spacing="5">PRODUCT OF SPAIN</text>
  <g fill="none" stroke="#809487" stroke-width="4"><path d="M350 413v160M350 453c-61-48-110-47-149-4 68 34 117 35 149 4Zm0 52c61-48 110-47 149-4-68 34-117 35-149 4Z"/></g>
  <text x="350" y="622" text-anchor="middle" fill="#253d50" font-family="Arial,sans-serif" font-size="18">13% ALC. BY VOL. · 750 mL</text><text x="350" y="655" text-anchor="middle" fill="#253d50" font-family="Arial,sans-serif" font-size="12">PRODUCT OF SPAIN · CONTAINS SULFITES</text><text x="350" y="678" text-anchor="middle" fill="#253d50" font-family="Arial,sans-serif" font-size="12">IMPORTED BY ATLANTIC SELECTIONS LLC, NEW YORK, NEW YORK</text>
  <rect x="63" y="735" width="574" height="105" fill="#fff" stroke="#253d50"/>
  <text x="78" y="758" fill="#111" font-family="Arial,sans-serif" font-size="12" font-weight="bold">GOVERNMENT WARNING:</text><text x="78" y="777" fill="#111" font-family="Arial,sans-serif" font-size="10">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="78" y="792" fill="#111" font-family="Arial,sans-serif" font-size="10">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="78" y="807" fill="#111" font-family="Arial,sans-serif" font-size="10">impairs your ability to drive a car or operate machinery, and may cause health problems.</text>
