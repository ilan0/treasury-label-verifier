<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Glare-obscured whiskey photograph simulation</title><desc id="desc">A skewed dark whiskey label with bright glare covering critical text.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".42" stop-color="#fff" stop-opacity=".88"/><stop offset=".65" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="1.8"/></filter></defs>
  <rect width="700" height="900" fill="#76736c"/><g transform="translate(42 25) rotate(-4 320 420) skewX(-3)" filter="url(#blur)"><rect x="40" y="40" width="570" height="800" rx="25" fill="#202728" stroke="#c19b53" stroke-width="5"/><text x="325" y="165" text-anchor="middle" fill="#e6d2a3" font-family="Georgia,serif" font-size="43">OLD TOM DISTILLERY</text><text x="325" y="230" text-anchor="middle" fill="#e6d2a3" font-family="Arial,sans-serif" font-size="23" letter-spacing="7">BOURBON WHISKEY</text><circle cx="325" cy="386" r="91" fill="none" stroke="#c19b53" stroke-width="4"/><path d="M270 410 325 312l55 98Z" fill="none" stroke="#c19b53" stroke-width="7"/><text x="325" y="547" text-anchor="middle" fill="#e6d2a3" font-family="Arial,sans-serif" font-size="20">45% ALC./VOL. · 750 mL</text><text x="325" y="604" text-anchor="middle" fill="#e6d2a3" font-family="Arial,sans-serif" font-size="13">BOTTLED BY OLD TOM DISTILLING COMPANY, BARDSTOWN, KY</text><rect x="76" y="685" width="498" height="115" fill="#f5f2e9"/><text x="91" y="709" fill="#111" font-family="Arial,sans-serif" font-size="11" font-weight="bold">GOVERNMENT WARNING:</text><text x="91" y="727" fill="#111" font-family="Arial,sans-serif" font-size="9">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="91" y="742" fill="#111" font-family="Arial,sans-serif" font-size="9">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="91" y="757" fill="#111" font-family="Arial,sans-serif" font-size="9">impairs your ability to drive a car or operate machinery, and may cause health problems.</text></g><path d="M145 0 520 0 365 900 30 900Z" fill="url(#g)" opacity=".9"/>
</svg>
