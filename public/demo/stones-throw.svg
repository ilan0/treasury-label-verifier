<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Stone's Throw whiskey label</title><desc id="desc">A modern black and white rye whiskey label.</desc>
  <rect width="700" height="900" rx="25" fill="#f1efe9"/><rect x="24" y="24" width="652" height="852" rx="14" fill="none" stroke="#20292d" stroke-width="5"/>
  <g fill="#20292d"><circle cx="240" cy="135" r="28"/><circle cx="298" cy="110" r="18"/><circle cx="346" cy="143" r="34"/><circle cx="405" cy="102" r="22"/><circle cx="457" cy="140" r="29"/></g>
  <text x="350" y="260" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="61" font-weight="900" letter-spacing="2">STONE'S</text><text x="350" y="330" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="61" font-weight="900" letter-spacing="2">THROW</text><rect x="160" y="368" width="380" height="4" fill="#20292d"/>
  <text x="350" y="436" text-anchor="middle" fill="#20292d" font-family="Georgia,serif" font-size="34">KENTUCKY STRAIGHT</text><text x="350" y="484" text-anchor="middle" fill="#20292d" font-family="Georgia,serif" font-size="38">BOURBON WHISKEY</text>
  <text x="350" y="576" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="21" font-weight="bold">45% ALC./VOL. · 90 PROOF</text><text x="350" y="618" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="18">750 mL</text><text x="350" y="680" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="13">DISTILLED AND BOTTLED BY OLD TOM DISTILLING COMPANY</text><text x="350" y="704" text-anchor="middle" fill="#20292d" font-family="Arial,sans-serif" font-size="13">BARDSTOWN, KENTUCKY</text>
  <rect x="68" y="737" width="564" height="105" fill="#fff" stroke="#20292d"/>
  <text x="83" y="760" fill="#111" font-family="Arial,sans-serif" font-size="12" font-weight="bold">GOVERNMENT WARNING:</text><text x="83" y="778" fill="#111" font-family="Arial,sans-serif" font-size="10">(1) According to the Surgeon General, women should not drink alcoholic beverages during</text><text x="83" y="793" fill="#111" font-family="Arial,sans-serif" font-size="10">pregnancy because of the risk of birth defects. (2) Consumption of alcoholic beverages</text><text x="83" y="808" fill="#111" font-family="Arial,sans-serif" font-size="10">impairs your ability to drive a car or operate machinery, and may cause health problems.</text>
</svg>
